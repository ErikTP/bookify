<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Läs, dela och upptäck böcker hos oss på Bokklubben!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <!-- <link rel="stylesheet" href="styles.css" /> -->
    <script src="https://kit.fontawesome.com/1cafef2066.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="adminstyle.css">
    <script src="sendtodb.js" defer></script>
    <script src="books.js" defer></script>
    <script src="users.js" defer></script>
    <script src="logout.js" defer></script>
    <script src="adminwelcome.js" defer></script>
    <title>Bokklubben</title>
</head>

<body>
    <header id="admin-header" class="admin-header"><div><p id="welcome"></div><button id="logout" class="logout-button">Logga ut</button></p></header>
    <main>
        <!-- GLÖM INTE ATT NAMGE SMART OCH FINT -->
        <fieldset class="form-container">
            <h2>Lägg till bok</h2>
            <form id="bookInputForm">
                <label for="bookTitle">Titel</label><br>
                <input type="text" id="bookTitleInput" name="bookTitleInput" placeholder="Djungelboken"><br>
                <label for="bookAuthor">Författare</label><br>
                <input type="text" id="bookAuthorInput" name="bookAuthorInput" placeholder="Astrid Lindgren"><br>
                <label for="bookSynopsis">Handling</label><br>
                <textarea name="bookSynopsisInput" id="bookSynopsisInput"></textarea><br>
                <label for="bookCoverInput">Omslag</label><br>
                <input type="file" id="bookCoverInput" name="bookCoverInput"><br>
                <label for="genre">Genre</label><br>
                <select name="bookGenreInput" id="bookGenreInput">
                    <option value="Skräck">Skräck</option>
                    <option value="Romantik">Romantik</option>
                    <option value="Klassiker">Klassiker</option>
                    <option value="Humor">Humor</option>
                    <option value="Science fiction">Science fiction</option>
                    <option value="Mysterium">Mysterium</option>
                    <option value="Dokumentär">Dokumentär</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Mytologi">Mytologi</option>
                    <option value="Biologi">Biologi</option>
                    <option value="Matematik">Matematik</option>
                    <option value="Vetenskap">Vetenskap</option>

                </select><br>
                <button id="submitBook">Lägg till</button>
            </form>
        </fieldset>
        <section class="books-container">
            <h2 id="library">Library</h2>
            <ol id="bookItem" class="bookItem">
                <!-- Här hamnar items -->
            </ol>
        </section>

        <fieldset class="form-container">
            <h2>Lägg till användare</h2>
            <form id="userInputForm"><br>
                <label for="username">Användarnamn</label><br>
                <input type="text" id="usernameInput"><br>
                <label for="password">Lösenord</label><br>
                <input type="text" id="passwordInput"><br>
                <label for="userRole">Roll</label><br>
                <select name="userRoleInput" id="userRoleInput"><br>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
                <button id="submitUser">Lägg till</button>   
            </form>
        </fieldset>
        <section class="user-container">
            <h2 id="users">Users</h2>
            <ol id="userItem">
                <!-- Här hamnar users -->
            </ol>
        </section>
    </main>

</body>

</html>
